name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# A newer commit on a PR makes the older run pointless, so it is cancelled.
# On master a running publish is never interrupted — a half-pushed run would
# leave that commit without its image, and krill deploys by commit SHA — and
# runs go one at a time, so `latest` cannot be overwritten by an older commit.
# GitHub keeps only the newest pending run, though: in a burst of pushes an
# intermediate commit may get no image at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod, а не дублируется здесь: иначе она живёт
          # в двух местах и однажды разъедется с той, под которую собирают.
          go-version-file: go.mod

      # Собранный tailwind.css лежит в репозитории (его требует //go:embed),
      # поэтому он может отстать от шаблонов. Пересобираем и падаем, если diff.
      - name: Check built CSS is up to date
        run: make css-check

      - name: Run tests
        run: go test -v -race ./...

  # На PR образ только собирается: Dockerfile ломается независимо от тестов
  # (пути миграций, права, .dockerignore), и узнать об этом стоит до мержа,
  # а не на публикации из master.
  docker-build:
    name: Build image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64

  publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя образа в нижнем регистре: GHCR не принимает заглавные, а репозиторий
      # называется makeMe, поэтому github.repository сюда не подставить.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/proshik/makeme:latest
            ghcr.io/proshik/makeme:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
