name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Собранный tailwind.css лежит в репозитории (его требует //go:embed),
      # поэтому он может отстать от шаблонов. Пересобираем и падаем, если diff.
      - name: Check built CSS is up to date
        run: make css-check

      - name: Run tests
        run: go test -v -race ./...
