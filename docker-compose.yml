services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: makeme
      POSTGRES_USER: makeme
      POSTGRES_PASSWORD: makeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makeme"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
